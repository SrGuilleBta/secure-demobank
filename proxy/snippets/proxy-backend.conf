proxy_pass http://backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Host fijo: el backend nunca recibe un Host elegido por el cliente (amenaza T-05).
proxy_set_header Host localhost;
# Se SOBRESCRIBE X-Forwarded-For con la IP real (no se anexa): el cliente no puede falsificar su IP
# en la bitácora de auditoría ni evadir el rate limiting del backend (amenaza T-12).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
