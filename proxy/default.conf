# Reverse proxy de Secure DemoBank (contexto http de nginx).
# Responsable de infraestructura: Arquitectura/DevSecOps. Las cabeceras (CSP) las ajusta Frontend/Pruebas.

server_tokens off;

# Rate limiting por IP. "auth" es más estricto para frenar fuerza bruta en login/registro (amenaza T-03).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream backend {
    server backend:8000;
    keepalive 16;
}

# Servidor por defecto: cualquier petición cuyo Host no sea localhost/127.0.0.1 se rechaza
# (Host header injection y DNS rebinding, amenaza T-05).
server {
    listen 8080 default_server;
    return 421;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    # La API solo recibe JSON pequeño; limitar el cuerpo y los tiempos reduce DoS (amenaza T-18).
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Ojo: add_header NO se hereda si un location define el suyo; por eso cada location incluye sus cabeceras.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/api-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Swagger UI de FastAPI (solo responde con APP_ENV=development). Necesita su CDN y un script inline,
    # por eso su CSP es más laxa que la del resto del sitio; en producción el backend devuelve 404.
    location = /api/docs {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src https://cdn.jsdelivr.net 'unsafe-inline'; style-src https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/proxy-backend.conf;
    }
}
