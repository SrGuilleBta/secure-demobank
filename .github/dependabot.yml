# Actualizaciones automáticas de dependencias: cada PR de Dependabot pasa por el pipeline de seguridad.
# cooldown: no se proponen versiones con menos de 14 días publicadas (paquetes maliciosos o rotos suelen
# detectarse y retirarse en ese lapso). Las actualizaciones de SEGURIDAD no esperan el cooldown.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
