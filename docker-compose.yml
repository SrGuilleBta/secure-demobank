# Secure DemoBank — entorno local.
# Arranque: `python scripts/dev.py up` (genera los secretos la primera vez).
# Arquitectura y límites de confianza: docs/arquitectura.md

name: secure-demobank

# Endurecimiento común a todos los contenedores (ver docs/arquitectura.md, sección "Decisiones").
x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 200
  restart: unless-stopped

services:
  # Único punto de entrada: sirve el frontend React, aplica cabeceras de seguridad y rate limiting.
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    <<: *hardening
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/snippets:/etc/nginx/snippets:ro
    tmpfs:
      - /tmp
    mem_limit: 128m
    networks:
      - public
      - edge
    depends_on:
      backend:
        condition: service_healthy

  # API FastAPI. No publica puertos: solo es alcanzable a través del proxy.
  backend:
    build: ./backend
    <<: *hardening
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_NAME: demobank
      DB_USER: demobank_app
      FORWARDED_ALLOW_IPS: ${EDGE_SUBNET:-172.30.10.0/24}
    secrets:
      - db_app_password
      - app_secret_key
    tmpfs:
      - /tmp
    mem_limit: 256m
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL en red interna sin salida a internet y sin puertos publicados.
  db:
    image: postgres:17-alpine
    <<: *hardening
    user: "70:70" # usuario postgres de la imagen alpine; no corre como root
    environment:
      POSTGRES_DB: demobank
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      - db_migrator_password
      - db_app_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/schema.sql:/schema.sql:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 512m
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demobank"]
      interval: 5s
      timeout: 5s
      retries: 10

# public: única red con salida al host (publicación de puertos del proxy).
# edge y data son internas: el backend y la BD no tienen salida a internet.
networks:
  public:
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.10.0/24}
  data:
    internal: true

volumes:
  db-data:

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_app_password:
    file: ./secrets/db_app_password
  app_secret_key:
    file: ./secrets/app_secret_key
